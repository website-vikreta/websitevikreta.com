name: Test

# CI only guards the release branches (releases/**). stage and main take code straight from a release
# without re-running it, so they are deliberately not listed here.
on:
  pull_request:
    branches: ['releases/**']
  # Merged code gets the full suite, since PRs only run the critical subset
  push:
    branches: ['releases/**']

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

# Public values (NEXT_PUBLIC_*, shipped in the client bundle anyway). The Sanity dataset is public, so
# reads need no token. Without a project id `next build` throws "Configuration must contain `projectId`"
# while collecting page data, which is what failed every run before this.
env:
  NEXT_PUBLIC_SANITY_PROJECT_ID: 47y1k19o
  NEXT_PUBLIC_SANITY_DATASET: production
  NEXT_PUBLIC_SANITY_API_VERSION: '2024-01-01'
  # Placeholder EmailJS ids: the library throws "The service ID is required" on empty values before the
  # request is made, so every form test failed in CI. The tests mock the EmailJS endpoint, so these are never sent.
  NEXT_PUBLIC_EMAILJS_SERVICE_ID: ci-service
  NEXT_PUBLIC_EMAILJS_TEMPLATE_ID: ci-template
  NEXT_PUBLIC_EMAILJS_PUBLIC_KEY: ci-public-key
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  # Static checks: eslint and the TypeScript compiler.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run test:coverage

  # A standalone check so a broken build shows up as "build", not as an e2e failure.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Cache Next build
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('app/**', 'components/**', 'lib/**', 'public/**') }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    # The Chromium suite is ~20 min plus install and build; 30 left almost no headroom.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - name: Cache Playwright browser
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
      - name: Install Playwright system deps (browser cached)
        run: npx playwright install-deps chromium
        if: steps.pw-cache.outputs.cache-hit == 'true'

      - name: Cache Next build
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('app/**', 'components/**', 'lib/**', 'public/**') }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
      - run: npm run build

      # PRs: the @critical subset (page health and lead capture, 40 tests, a few minutes) so feedback is quick.
      # Pushes to main and releases/**: the whole suite (193 tests, ~15-20 min).
      - run: npx playwright test ${{ github.event_name == 'pull_request' && '--grep @critical' || '' }}
        env:
          CI: true
          PROD: true

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
